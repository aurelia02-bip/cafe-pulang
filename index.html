<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CAFE PULANG | Rasa yang Membuat Ingin Kembali</title>
  <meta name="description" content="CAFE PULANG - Tempat menikmati makanan, minuman, dan suasana yang berkelas. Pesan sekarang melalui WhatsApp.">

  <style>
    /* =========================================================
       CAFE PULANG
       Single File Website
       HTML + CSS + JavaScript
    ========================================================= */

    @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap');

    :root {
      --black: #05070a;
      --black-soft: #0b0f14;
      --navy: #0b1b33;
      --navy-light: #102b4c;
      --blue: #4d9dcc;
      --blue-light: #8bc9ed;
      --white: #f7f8fa;
      --gray: #aeb7c2;
      --gold: #d4af62;
      --gold-light: #efd18a;
      --border: rgba(212, 175, 98, 0.25);
      --shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Montserrat', sans-serif;
      background: var(--black);
      color: var(--white);
      line-height: 1.7;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    img {
      width: 100%;
      display: block;
    }

    /* =========================
       GLOBAL
    ========================= */

    .container {
      width: min(1180px, 90%);
      margin: auto;
    }

    .section {
      padding: 100px 0;
      position: relative;
    }

    .section-title {
      text-align: center;
      margin-bottom: 55px;
    }

    .section-title .small-title {
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .section-title h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(42px, 5vw, 65px);
      font-weight: 500;
      line-height: 1;
    }

    .section-title p {
      max-width: 600px;
      margin: 18px auto 0;
      color: var(--gray);
      font-size: 14px;
    }

    .gold {
      color: var(--gold);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 27px;
      border-radius: 3px;
      border: 1px solid var(--gold);
      background: var(--gold);
      color: #080a0d;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: .3s ease;
      cursor: pointer;
    }

    .btn:hover {
      background: transparent;
      color: var(--gold-light);
      transform: translateY(-2px);
    }

    .btn-outline {
      background: transparent;
      color: var(--white);
    }

    .btn-outline:hover {
      background: var(--gold);
      color: #080a0d;
    }

    /* =========================
       NAVBAR
    ========================= */

    header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 999;
      transition: .4s ease;
    }

    header.scrolled {
      background: rgba(5, 7, 10, .92);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255,255,255,.08);
    }

    nav {
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 3px;
    }

    .logo span {
      color: var(--gold);
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 32px;
      list-style: none;
    }

    .nav-links a {
      font-size: 12px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #d7dce2;
      transition: .3s;
    }

    .nav-links a:hover {
      color: var(--gold);
    }

    .menu-toggle {
      display: none;
      font-size: 27px;
      color: white;
      cursor: pointer;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      min-height: 100vh;
      display: flex;
      align-items: center;
      position: relative;
      background:
        radial-gradient(circle at 80% 20%, rgba(42, 113, 160, .25), transparent 35%),
        radial-gradient(circle at 20% 80%, rgba(15, 44, 78, .35), transparent 35%),
        linear-gradient(120deg, #030507 0%, #081322 55%, #05070a 100%);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: linear-gradient(to bottom, black, transparent);
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 750px;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--gold);
      text-transform: uppercase;
      letter-spacing: 4px;
      font-size: 12px;
      margin-bottom: 22px;
    }

    .hero-label::before {
      content: "";
      width: 38px;
      height: 1px;
      background: var(--gold);
    }

    .hero h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(65px, 10vw, 125px);
      font-weight: 500;
      line-height: .82;
      letter-spacing: -3px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .hero-description {
      max-width: 570px;
      margin: 30px 0;
      color: #b9c3ce;
      font-size: 15px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 13px;
    }

    .hero-decoration {
      position: absolute;
      right: 7%;
      top: 50%;
      transform: translateY(-50%);
      width: 370px;
      height: 370px;
      border: 1px solid rgba(212,175,98,.25);
      border-radius: 50%;
      box-shadow:
        0 0 100px rgba(56, 135, 185, .12),
        inset 0 0 80px rgba(212,175,98,.04);
    }

    .hero-decoration::before,
    .hero-decoration::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      inset: 35px;
      border: 1px solid rgba(139,201,237,.16);
    }

    .hero-decoration::after {
      inset: 80px;
      border-color: rgba(212,175,98,.18);
    }

    .hero-center {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .hero-center span {
      font-family: 'Cormorant Garamond', serif;
      font-size: 70px;
      color: var(--gold);
      opacity: .8;
    }

    .scroll-down {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      color: #77818d;
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    /* =========================
       ABOUT
    ========================= */

    .about {
      background: var(--black-soft);
    }

    .about-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 70px;
      align-items: center;
    }

    .about-visual {
      height: 500px;
      position: relative;
      background:
        linear-gradient(145deg, rgba(13,43,72,.9), rgba(4,8,13,.95));
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .about-visual::before {
      content: "PULANG";
      position: absolute;
      font-family: 'Cormorant Garamond', serif;
      font-size: 110px;
      color: rgba(255,255,255,.025);
      transform: rotate(-90deg);
      top: 160px;
      left: -85px;
      letter-spacing: 10px;
    }

    .about-frame {
      position: absolute;
      inset: 35px;
      border: 1px solid rgba(212,175,98,.35);
    }

    .about-frame-content {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .about-frame-content div {
      max-width: 260px;
    }

    .about-frame-content .symbol {
      font-family: 'Cormorant Garamond', serif;
      font-size: 100px;
      color: var(--gold);
      line-height: 1;
    }

    .about-frame-content p {
      color: var(--gray);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .about-text .eyebrow {
      color: var(--gold);
      letter-spacing: 3px;
      font-size: 11px;
      text-transform: uppercase;
    }

    .about-text h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 55px;
      font-weight: 500;
      line-height: 1;
      margin: 15px 0 25px;
    }

    .about-text p {
      color: var(--gray);
      font-size: 14px;
      margin-bottom: 18px;
    }

    .signature {
      margin-top: 30px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--gold);
    }

    /* =========================
       MENU
    ========================= */

    .menu-section {
      background:
        radial-gradient(circle at 90% 50%, rgba(18,55,91,.25), transparent 35%),
        var(--black);
    }

    .menu-tabs {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 40px;
    }

    .tab-btn {
      padding: 10px 20px;
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: var(--gray);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      transition: .3s;
    }

    .tab-btn.active,
    .tab-btn:hover {
      background: var(--gold);
      color: #080a0d;
      border-color: var(--gold);
    }

    .menu-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .menu-card {
      background: linear-gradient(145deg, #0d1219, #080b10);
      border: 1px solid rgba(255,255,255,.07);
      padding: 27px;
      transition: .35s;
      position: relative;
      overflow: hidden;
    }

    .menu-card:hover {
      transform: translateY(-7px);
      border-color: var(--border);
      box-shadow: var(--shadow);
    }

    .menu-number {
      color: rgba(212,175,98,.5);
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
    }

    .menu-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      font-weight: 600;
      margin: 10px 0 5px;
    }

    .menu-card p {
      color: #89939e;
      font-size: 12px;
      min-height: 45px;
    }

    .menu-price {
      margin-top: 18px;
      color: var(--gold);
      font-size: 14px;
      font-weight: 600;
    }

    /* =========================
       EXPERIENCE
    ========================= */

    .experience {
      background: linear-gradient(120deg, #07111e, #05070a);
      border-top: 1px solid rgba(255,255,255,.05);
      border-bottom: 1px solid rgba(255,255,255,.05);
    }

    .experience-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 25px;
    }

    .experience-card {
      padding: 45px 30px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.015);
      transition: .3s;
    }

    .experience-card:hover {
      border-color: var(--border);
      transform: translateY(-5px);
    }

    .experience-icon {
      font-size: 32px;
      color: var(--gold);
      margin-bottom: 20px;
    }

    .experience-card h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      margin-bottom: 10px;
    }

    .experience-card p {
      color: var(--gray);
      font-size: 13px;
    }

    /* =========================
       CTA
    ========================= */

    .cta {
      padding: 110px 0;
      text-align: center;
      background:
        radial-gradient(circle at center, rgba(20,61,97,.45), transparent 55%),
        var(--black);
    }

    .cta h2 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(50px, 7vw, 85px);
      font-weight: 500;
      line-height: .95;
      max-width: 800px;
      margin: auto;
    }

    .cta p {
      color: var(--gray);
      max-width: 550px;
      margin: 25px auto 30px;
      font-size: 14px;
    }

    /* =========================
       CONTACT
    ========================= */

    .contact {
      background: #070a0f;
    }

    .contact-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 50px;
    }

    .contact-info {
      padding: 35px;
      border: 1px solid rgba(255,255,255,.08);
      background: rgba(255,255,255,.015);
    }

    .contact-info h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 38px;
      margin-bottom: 25px;
    }

    .contact-item {
      display: flex;
      gap: 15px;
      margin: 20px 0;
      padding-bottom: 20px;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .contact-item .icon {
      color: var(--gold);
      font-size: 18px;
      width: 25px;
    }

    .contact-item small {
      color: #737e89;
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .contact-item p {
      color: #c6ccd2;
      font-size: 13px;
      margin-top: 3px;
    }

    .contact-map {
      min-height: 380px;
      border: 1px solid rgba(255,255,255,.08);
      background:
        linear-gradient(rgba(7,15,26,.82), rgba(7,15,26,.9)),
        repeating-linear-gradient(
          45deg,
          #102338,
          #102338 10px,
          #0c1c2e 10px,
          #0c1c2e 20px
        );
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .map-content span {
      font-size: 45px;
      color: var(--gold);
    }

    .map-content h3 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 35px;
      margin: 10px 0;
    }

    .map-content p {
      color: var(--gray);
      font-size: 13px;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      background: #030507;
      padding: 45px 0 25px;
      border-top: 1px solid rgba(255,255,255,.07);
    }

    .footer-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 30px;
      padding-bottom: 35px;
    }

    .footer-logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 35px;
      letter-spacing: 3px;
    }

    .footer-logo span {
      color: var(--gold);
    }

    .socials {
      display: flex;
      gap: 10px;
    }

    .socials a {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255,255,255,.1);
      color: var(--gray);
      font-size: 12px;
      transition: .3s;
    }

    .socials a:hover {
      color: var(--gold);
      border-color: var(--gold);
    }

    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,.06);
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      color: #626b75;
      font-size: 10px;
      letter-spacing: 1px;
    }

    /* =========================
       WHATSAPP FLOATING
    ========================= */

    .whatsapp {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: #25D366;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      z-index: 998;
      box-shadow: 0 10px 30px rgba(37,211,102,.25);
      transition: .3s;
    }

    .whatsapp:hover {
      transform: scale(1.08);
    }

    .whatsapp-tooltip {
      position: absolute;
      right: 70px;
      white-space: nowrap;
      background: #111820;
      border: 1px solid rgba(255,255,255,.1);
      padding: 8px 13px;
      border-radius: 4px;
      font-size: 10px;
      color: #dfe5ea;
      opacity: 0;
      pointer-events: none;
      transform: translateX(10px);
      transition: .3s;
    }

    .whatsapp:hover .whatsapp-tooltip {
      opacity: 1;
      transform: translateX(0);
    }

    /* =========================
       SCROLL REVEAL
    ========================= */

    .reveal {
      opacity: 0;
      transform: translateY(25px);
      transition: .8s ease;
    }

    .reveal.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      .nav-links {
        position: absolute;
        top: 82px;
        left: 0;
        width: 100%;
        background: rgba(5,7,10,.97);
        backdrop-filter: blur(15px);
        flex-direction: column;
        padding: 25px;
        gap: 22px;
        transform: translateY(-150%);
        opacity: 0;
        transition: .4s;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }

      .nav-links.active {
        transform: translateY(0);
        opacity: 1;
      }

      .menu-toggle {
        display: block;
      }

      .hero-decoration {
        opacity: .25;
        right: -120px;
      }

      .about-grid,
      .contact-grid {
        grid-template-columns: 1fr;
      }

      .menu-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .experience-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {

      .section {
        padding: 75px 0;
      }

      .hero {
        min-height: 850px;
      }

      .hero h1 {
        font-size: 72px;
      }

      .hero-description {
        font-size: 13px;
      }

      .hero-decoration {
        width: 300px;
        height: 300px;
        right: -130px;
        top: 35%;
      }

      .about-visual {
        height: 380px;
      }

      .about-text h2 {
        font-size: 45px;
      }

      .menu-grid {
        grid-template-columns: 1fr;
      }

      .footer-top,
      .footer-bottom {
        flex-direction: column;
        align-items: flex-start;
      }

      .contact-info {
        padding: 25px;
      }

      .cta {
        padding: 80px 0;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       NAVBAR
  ========================== -->

  <header id="header">
    <div class="container">
      <nav>

        <a href="#home" class="logo">
          CAFE <span>PULANG</span>
        </a>

        <ul class="nav-links" id="navLinks">
          <li><a href="#home">Beranda</a></li>
          <li><a href="#about">Tentang</a></li>
          <li><a href="#menu">Menu</a></li>
          <li><a href="#experience">Suasana</a></li>
          <li><a href="#contact">Kontak</a></li>
          <li>
            <a
              href="https://wa.me/628123456780?text=Halo%20CAFE%20PULANG%2C%20saya%20ingin%20memesan."
              target="_blank"
              class="btn"
            >
              Pesan Sekarang
            </a>
          </li>
        </ul>

        <div class="menu-toggle" id="menuToggle">☰</div>

      </nav>
    </div>
  </header>


  <!-- =========================
       HERO
  ========================== -->

  <section class="hero" id="home">

    <div class="container">

      <div class="hero-content reveal">

        <div class="hero-label">
          Welcome to CAFE PULANG
        </div>

        <h1>
          Rasa yang<br>
          membuat <span>pulang.</span>
        </h1>

        <p class="hero-description">
          Sebuah tempat untuk menikmati hidangan pilihan,
          berbagi cerita, dan menemukan kembali arti dari
          sebuah perjalanan pulang.
        </p>

        <div class="hero-buttons">

          <a hr
